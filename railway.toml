# Railway config-as-code for the API service (thaleia-api).
#
# Config in code overrides dashboard settings, so the ingest cron service
# must NOT read this file: point its "Config-as-code file path" at
# railway.ingest.toml instead (see README.md "Deployment (Railway)").

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "thaleia-api"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
