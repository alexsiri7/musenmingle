# Railway config-as-code for the ingest cron service (thaleia-ingest).
# Set this service's "Config-as-code file path" to /railway.ingest.toml.
#
# The job runs every 15 minutes and exits; per-source `interval_minutes` in
# events.sources decides which sources actually run on each tick, and a
# Postgres advisory lock prevents overlapping runs. No healthcheck (it is not
# a server) and no restarts (the next tick is the retry).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "thaleia-ingest"
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
